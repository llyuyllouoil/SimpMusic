name: Build test APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency:
  group: llyuymusic-android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Build FOSS debug APK
        run: |
          echo "isFullBuild=false" >> gradle.properties
          ./gradlew :androidApp:assembleDebug --no-configuration-cache

      - name: Stage the single ARM64 APK
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk androidApp/build/outputs/apk/debug/llyuymusic-arm64.apk

      - name: Upload the single ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: llyuymusic-arm64-debug-apk
          path: androidApp/build/outputs/apk/debug/llyuymusic-arm64.apk
          if-no-files-found: error
          retention-days: 7
