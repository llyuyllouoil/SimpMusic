name: Build test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Build FOSS debug APK
        run: |
          echo "isFullBuild=false" >> gradle.properties
          ./gradlew :androidApp:assembleDebug --no-configuration-cache

      - name: Upload universal APK only
        uses: actions/upload-artifact@v4
        with:
          name: llyuymusic-universal-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk
          if-no-files-found: error
          retention-days: 7
